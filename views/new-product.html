{{> header}}

<!-- ===== Main content: product form (used to create and to edit) ===== -->
<main class="container flex-grow-1 py-5">
    <div class="mb-4">
        <a href="{{cancelUrl}}" class="btn btn-site-secondary">
            <i class="bi bi-arrow-left me-1"></i> Volver
        </a>
    </div>

    <h1 class="page-title mb-4">
        {{#isEdit}}Editar producto{{/isEdit}}{{^isEdit}}Añadir nuevo producto{{/isEdit}}
    </h1>

    <div class="row g-4">
        <!-- Current image when editing, icon when creating -->
        <div class="col-12 col-lg-5">
            <div class="image-panel">
                {{#isEdit}}
                <img src="{{product.image}}" alt="{{product.title}}" />
                {{/isEdit}}
                {{^isEdit}}
                <img src="/images/newproduct_icon.png_bg_removed.png.png" alt="Icono de nuevo producto" />
                {{/isEdit}}
            </div>
        </div>

        <!-- Form -->
        <div class="col-12 col-lg-7">
            <form class="review-form" action="{{formAction}}" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="productTitle" class="form-label">Nombre del producto</label>
                    <input
                        type="text"
                        class="form-control"
                        id="productTitle"
                        name="title"
                        value="{{product.title}}"
                        placeholder="Ej. Carta Charizard"
                        required
                        maxlength="100"
                        pattern="[A-ZÁÉÍÓÚÑ].*"
                        title="El nombre debe empezar por mayúscula"
                    />
                </div>

                <div class="mb-3">
                    <label for="productText" class="form-label">Descripción</label>
                    <textarea
                        class="form-control"
                        id="productText"
                        name="text"
                        rows="4"
                        placeholder="Escribe una descripción del producto (entre 20 y 500 caracteres)"
                        required
                        minlength="20"
                        maxlength="500"
                    >{{product.text}}</textarea>
                </div>

                <div class="mb-3">
                    <label for="productCategory" class="form-label">Categoría</label>
                    <select class="form-select" id="productCategory" name="category" required>
                        <option value="" disabled {{^isEdit}}selected{{/isEdit}}>Selecciona una categoría</option>
                        {{#categoryOptions}}
                        <option value="{{name}}" {{#selected}}selected{{/selected}}>{{name}}</option>
                        {{/categoryOptions}}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="productPrice" class="form-label">Precio (€)</label>
                    <input
                        type="number"
                        class="form-control"
                        id="productPrice"
                        name="price"
                        value="{{product.price}}"
                        placeholder="Ej. 29.99"
                        required
                        min="0.01"
                        max="10000"
                        step="0.01"
                    />
                </div>

                <div class="mb-4">
                    <label for="productImage" class="form-label">
                        {{#isEdit}}Cambiar imagen (opcional){{/isEdit}}{{^isEdit}}Imagen del producto{{/isEdit}}
                    </label>
                    <input
                        type="file"
                        class="form-control"
                        id="productImage"
                        name="image"
                        accept=".png,.jpg,.jpeg"
                        {{^isEdit}}required{{/isEdit}}
                    />
                    {{#isEdit}}
                    <div class="form-text">Si no eliges ninguna imagen, se mantiene la actual.</div>
                    {{/isEdit}}
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{cancelUrl}}" class="btn btn-site-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-site-primary">
                        {{#isEdit}}Guardar cambios{{/isEdit}}{{^isEdit}}Guardar producto{{/isEdit}}
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

{{> footer}}
