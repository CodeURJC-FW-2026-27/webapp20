
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PokeURJC - Tienda de productos Pokémon">

    <title>{{pageTitle}} - PokeURJC</title>

    <link rel="icon" type="image/png" href="/images/PokeURJC.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monofett&family=Nabla&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">

    <link href="/PokeURJC.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark site-navbar">
        <div class="container">

            <a href="/" class="navbar-brand d-flex align-items-center fw-bold">
                <img class="site-logo me-2"
                     src="/images/PokeURJC.png"
                     alt="Logo de PokeURJC">
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Inicio</a>
                    </li>

                    <<li class="nav-item"><a class="nav-link" href="/?category=Cartas">Cartas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/?category=Peluches">Peluches</a></li>
                    <li class="nav-item"><a class="nav-link" href="/?category=Figuras">Figuras</a></li>
                    <li class="nav-item"><a class="nav-link" href="/?category=Ropa">Ropa</a></li>
                    <li class="nav-item"><a class="nav-link" href="/?category=Accesorios">Accesorios</a></li>
                </ul>

                <form class="d-flex" role="search" action="/" method="GET">
                    <input class="form-control me-2"
                           type="search"
                           name="search"
                           placeholder="Buscar productos..."
                           aria-label="Buscar">

                    <button class="btn btn-site-secondary" type="submit">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                </form>

            </div>
        </div>
    </nav>
