{{> header}}

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <div class="mb-4">
                <a href="/products/{{product._id}}" class="btn-site-secondary">
                    Volver al producto
                </a>
            </div>

            <h1 class="page-title mb-4">Editar producto</h1>

            <form class="review-form"
                  action="/products/{{product._id}}/edit"
                  method="POST"
                  enctype="multipart/form-data">

                {{#error}}
                <p class="text-danger">{{error}}</p>
                {{/error}}

                {{#product.image}}
                <div class="image-panel mb-4" style="min-height: 220px;">
                    <img src="{{product.image}}"
                         alt="{{product.title}}"
                         style="max-height: 180px;">
                </div>
                {{/product.image}}

                <div class="mb-3">
                    <label class="form-label" for="title">Título</label>
                    <input class="form-control"
                           id="title"
                           name="title"
                           value="{{product.title}}"
                           maxlength="100"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="text">Descripción</label>
                    <textarea class="form-control"
                              id="text"
                              name="text"
                              rows="4"
                              required>{{product.text}}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="category">Categoría</label>
                    <select class="form-select" id="category" name="category" required>
                        <option value="Cartas" {{#product.isCartas}}selected{{/product.isCartas}}>Cartas</option>
                        <option value="Peluches" {{#product.isPeluches}}selected{{/product.isPeluches}}>Peluches</option>
                        <option value="Figuras" {{#product.isFiguras}}selected{{/product.isFiguras}}>Figuras</option>
                        <option value="Ropa" {{#product.isRopa}}selected{{/product.isRopa}}>Ropa</option>
                        <option value="Accesorios" {{#product.isAccesorios}}selected{{/product.isAccesorios}}>Accesorios</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="price">Precio</label>
                    <input class="form-control"
                           id="price"
                           name="price"
                           type="number"
                           min="0"
                           step="0.01"
                           value="{{product.priceInput}}"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="image">
                        Cambiar imagen (opcional)
                    </label>
                    <input class="form-control"
                           id="image"
                           name="image"
                           type="file"
                           accept="image/*">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/products/{{product._id}}" class="btn-site-secondary">
                        Cancelar
                    </a>
                    <button class="btn-site-primary" type="submit">
                        Guardar cambios
                    </button>
                </div>
            </form>

        </div>
    </div>
</main>

{{> footer}}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
