<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="PokeURJC - Añadir nuevo producto"/>
    <title>Añadir producto - PokeURJC</title>

    <link rel="icon" type="image/png" href="images/PokeURJC.png" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"rel="stylesheet"/>
    <!-- Project styles -->
    <link href="resources/PokeURJC.css" rel="stylesheet" />
  </head>


  <body class="d-flex flex-column min-vh-100">

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark site-navbar">
      <div class="container">
        <a href="index.html" class="navbar-brand d-flex align-items-center fw-bold">
          <img src="images/PokeURJC.png" class="site-logo me-2" alt="Logo de PokeURJC"/>
        </a>
      </div>
    </nav>



    <!-- Add product page -->
    <main class="container py-5">
      <div class="mb-4">
        <a href="index.html" class="btn-site-primary">
          <i class="bi bi-arrow-left"></i> Volver
        </a>
      </div>

      <h2 class="add-product-title mb-4">Añadir nuevo producto</h2>
      <div class="row g-4">
        <!-- Product image -->
        <div class="col-12 col-lg-5">
          <div class="add-product-image">
            <img src="images/newproduct_icon.png_bg_removed.png.png" alt="Icono de nuevo producto"/>
          </div>
        </div>

        <!-- Form -->
        <div class="col-12 col-lg-7">
          <form>
            <div class="mb-3">
              <label for="productName" class="form-label">Nombre del producto</label>
              <input type="text" class="form-control" id="productName" placeholder="Ej. Carta Charizard"/>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Descripción</label>
              <textarea class="form-control" id="description" rows="4" placeholder="Escribe una breve descripción del producto"></textarea>
            </div>

            <div class="mb-3">
              <label for="category" class="form-label">Categoría</label>
              <select class="form-select" id="category">
                <option disabled selected value="">Selecciona una categoría</option>
                <option>Cartas</option>
                <option>Peluches</option>
                <option>Figuras</option>
                <option>Ropa</option>
                <option>Accesorios</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="price" class="form-label">Precio</label>
              <input type="number" min="0" step="0.01" class="form-control" id="price" placeholder="Ej. 29,99 €" required/>
            </div>

            <div class="mb-4">
              <label for="file" class="form-label">Imagen del producto</label>
              <input type="file" class="form-control" id="file" accept=".png,.jpg,.jpeg" required/>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a href="index.html" class="btn-site-secondary">Cancelar</a>
              <button type="submit" class="btn-site-primary">Guardar producto</button>
            </div>

          </form>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer py-4 mt-auto">
      <div class="container text-center">
        <p class="mb-1 fw-bold">PokeURJC</p>
        <p class="mb-0 small">
          Proyecto de Fundamentos de la Web · URJC 2026–27 · webapp20
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
